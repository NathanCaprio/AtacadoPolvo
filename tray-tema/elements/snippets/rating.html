{% if total is not defined %}
    {% set total = false %}
{% endif %}

<div class="product-rating flex justify-center">
    {% for rating in 1..5 %}
        {% if review.rating >= rating %}
            <div class="icon active"></div>
        {% else %}
            <div class="icon"></div>
        {% endif %}
    {% endfor %}

    {% if total %}
        <a href="javascript:void(0)" class="total">
            {% if review.count == 0 %}
                Seja o primeiro a opinar
            {% else %}
                {{ review.count }} Opiniões
            {% endif %}
        </a>
    {% endif %}
</div>
