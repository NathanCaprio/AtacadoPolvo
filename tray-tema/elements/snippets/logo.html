{% if section.settings.enabled %}
    <div class="block-logo flex align-center justify-center" id="{{ section.id }}">

        {# Atacado Polvo: marca fixa no tema (polvo-marca.html) no lugar do logo do painel. #}
        <a class="logo polvo-marca" href="{{ store.url }}" title="{{ store.name }}">

            {% element 'snippets/polvo-marca' %}

            {% if 'home' in pages.current %}
                <h1 class="title-store">{{ store.name }}</h1>
            {% else %}
                <div class="title-store">{{ store.name }}</div>
            {% endif %}

        </a>

    </div>
{% endif %}
